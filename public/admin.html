<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNILUS Chipo — Staff Dashboard</title>
<link rel="icon" type="image/jpeg" href="/images/logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  :root {
    --green-deep: #0a4429;
    --green-mid: #0f5c37;
    --green-bright: #157a46;
    --gold: #c9a227;
    --gold-light: #e6c85c;
    --brand-deep: #0a4429;
    --brand-mid: #0f5c37;
    --brand-bright: #157a46;
    --accent: #c9a227;
    --accent-soft: #e6c85c;
    --bg: #f6f5f1;
    --bg-2: #f0eee8;
    --panel: #ffffff;
    --surface: rgba(255, 255, 255, 0.82);
    --surface-solid: #ffffff;
    --text-dark: #1c231f;
    --text: #1c231f;
    --text-soft: #4c5852;
    --text-muted: #6b7570;
    --border: #e4e2da;
    --border-strong: #d8d5cb;
    --line: #e4e2da;
    --line-strong: #d8d5cb;
    --red: #d64545;
    --blue: #2f6fa8;
    --radius-lg: 20px;
    --shadow-lg: 0 30px 70px -40px rgba(10, 68, 41, 0.55);
    --glow: 0 18px 44px -18px rgba(21, 122, 70, 0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text-dark);
  }

  h1, h2, h3 {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
  }

  /* ---------- Session restore ---------- */
  .boot-screen {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
    background:
      radial-gradient(1100px 620px at 78% -8%, rgba(201, 162, 39, 0.18), transparent 62%),
      radial-gradient(900px 620px at -8% 22%, rgba(21, 122, 70, 0.18), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 55%, var(--bg) 100%);
  }
  .boot-screen[hidden] { display: none; }
  .boot-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
  }
  .boot-crest {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(201,162,39,0.5), 0 18px 40px -18px rgba(10,68,41,0.6);
  }
  .boot-crest img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .boot-card p { margin: 0; font-size: 0.92rem; font-weight: 600; color: var(--text-dark); }
  .boot-spinner {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 3px solid rgba(21, 122, 70, 0.2);
    border-top-color: var(--green-bright);
    animation: bootSpin 0.9s linear infinite;
  }
  @keyframes bootSpin { to { transform: rotate(360deg); } }

  /* ---------- Login screen ---------- */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(1100px 620px at 78% -8%, rgba(201, 162, 39, 0.18), transparent 62%),
      radial-gradient(900px 620px at -8% 22%, rgba(21, 122, 70, 0.18), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 55%, var(--bg) 100%);
  }
  .login-screen[hidden] { display: none; }

  .login-card {
    background: var(--surface);
    backdrop-filter: blur(30px) saturate(1.5);
    -webkit-backdrop-filter: blur(30px) saturate(1.5);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 42px;
    width: min(460px, 100%);
    box-shadow: var(--shadow-lg);
    position: relative;
    z-index: 1;
  }

  .login-crest {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(201,162,39,0.55);
    margin-bottom: 14px;
  }
  .login-crest img { display: block; width: 100%; height: 100%; object-fit: cover; }

  .login-card h1 {
    font-family: 'Space Grotesk', Inter, sans-serif;
    font-size: 1.9rem;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    color: var(--text-dark);
  }

  .login-card p.sub {
    margin: 0 0 26px;
    color: var(--text-muted);
    font-size: 0.88rem;
    line-height: 1.7;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 0.82rem;
    font-weight: 650;
    color: var(--text-dark);
    margin-bottom: 8px;
  }

  .field input,
  .field select {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    background: #fff;
    color: var(--text-dark);
    font-size: 0.9rem;
    font-family: inherit;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .field input:focus,
  .field select:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.15);
  }

  .btn-primary {
    width: 100%;
    height: 50px;
    margin-top: 22px;
    background: linear-gradient(135deg, var(--green-deep) 0%, var(--green-bright) 100%);
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 12px;
    font-size: 0.92rem;
    font-weight: 650;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 16px 40px -16px rgba(10, 68, 41, 0.9);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .btn-primary:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--green-bright) 0%, var(--green-mid) 100%);
    transform: translateY(-2px);
    box-shadow: var(--glow);
  }
  .btn-primary:disabled { background: #b7bdb8; cursor: not-allowed; box-shadow: none; transform: none; }

  .secondary-link {
    width: 100%;
    margin-top: 12px;
    border: 1px solid rgba(10,68,41,0.2);
    background: transparent;
    color: var(--green-deep);
    border-radius: 10px;
    padding: 9px 10px;
    font-size: 0.85rem;
    font-weight: 650;
    font-family: inherit;
    cursor: pointer;
  }
  .secondary-link:hover { background: rgba(10, 68, 41, 0.05); }

  .login-error {
    color: var(--red);
    font-size: 0.82rem;
    margin-top: 10px;
    min-height: 16px;
  }

  /* ---------- Dashboard shell ---------- */
  .app { display: none; height: 100vh; }
  .app.visible { display: flex; }

  .sidebar {
    width: 272px;
    flex-shrink: 0;
    background: linear-gradient(180deg, rgba(10, 68, 41, 0.98) 0%, rgba(6, 48, 24, 0.98) 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 24px 16px 28px;
    border-right: 1px solid rgba(230, 200, 92, 0.18);
    box-shadow: 24px 0 60px -40px rgba(10, 68, 41, 0.8);
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  .brand { display: flex; align-items: center; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.12); margin-bottom: 12px; }
  .brand-crest { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; background: #fff; box-shadow: 0 0 0 2px rgba(230,200,92,0.5), 0 12px 30px -14px rgba(0,0,0,0.55); flex-shrink: 0; }
  .brand-crest img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .brand-text h1 { font-size: 0.9rem; margin: 0; font-weight: 700; letter-spacing: 0.01em; }
  .brand-text p { margin: 3px 0 0; font-size: 0.7rem; color: var(--accent-soft); opacity: 0.9; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border-radius: 10px;
    color: rgba(255,255,255,0.82);
    cursor: pointer;
    font-size: 0.88rem;
    margin-bottom: 4px;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .nav-item:hover { background: rgba(255,255,255,0.08); }
  .nav-item.active { background: rgba(230, 200, 92, 0.16); color: #fff; font-weight: 650; }
  .nav-badge {
    margin-left: auto;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    color: var(--green-deep);
    font-size: 0.68rem;
    font-weight: 700;
    padding: 1px 8px;
    border-radius: 10px;
  }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.12);
    font-size: 0.8rem;
  }
  .sidebar-footer .staff-name { color: #fff; font-weight: 600; margin-bottom: 8px; }
  .logout-link { color: var(--gold-light); cursor: pointer; background: none; border: none; padding: 0; font-size: 0.8rem; font-family: inherit; }
  .logout-link:hover { text-decoration: underline; }

  /* ---------- Main area ---------- */
  .main {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    background:
      radial-gradient(1100px 620px at 78% -8%, rgba(201, 162, 39, 0.10), transparent 62%),
      radial-gradient(900px 620px at -8% 22%, rgba(21, 122, 70, 0.10), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 55%, var(--bg) 100%);
  }
  .topbar {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(246,245,241,0.72));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 5;
    box-shadow: inset 0 -1px 0 rgba(10, 68, 41, 0.04);
  }
  .topbar h2 {
    margin: 0;
    font-size: 1.3rem;
    letter-spacing: -0.02em;
    color: var(--green-deep);
  }
  .topbar p {
    margin: 4px 0 0;
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .content { padding: 26px 32px 60px; max-width: 1180px; }

  .panel {
    background: var(--surface);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px -40px rgba(10, 68, 41, 0.45);
  }

  .panel-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .panel-header h3 { margin: 0; font-size: 1rem; color: var(--green-deep); }

  .btn-add {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    color: var(--green-deep);
    border: none;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 0.82rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .btn-add:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -14px rgba(201,162,39,0.7); }

  /* Filters (tickets) */
  .filter-row { display: flex; gap: 8px; padding: 14px 20px 0; flex-wrap: wrap; align-items: center; }
  .filter-chip {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-dark);
    padding: 6px 15px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .filter-chip:hover { border-color: var(--green-mid); color: var(--green-deep); }
  .filter-chip.active { background: var(--green-deep); border-color: var(--green-deep); color: #fff; }

  /* Table */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.83rem; min-width: 920px; }
  th {
    text-align: left;
    padding: 12px 18px;
    color: var(--text-muted);
    font-weight: 650;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    background: rgba(246, 245, 241, 0.6);
  }
  td { padding: 12px 18px; border-bottom: 1px solid var(--border); vertical-align: top; word-break: break-word; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(10, 68, 41, 0.03); }
  .cell-muted { color: var(--text-muted); font-size: 0.78rem; }
  .cell-q { min-width: 200px; max-width: 320px; }
  .cell-ref { white-space: nowrap; font-weight: 600; color: var(--green-deep); }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 650; white-space: nowrap; }
  .badge-open { background: #fdf1d6; color: #8a6a10; }
  .badge-in_progress { background: #e4edf7; color: var(--blue); }
  .badge-resolved { background: #e2f3e7; color: var(--green-deep); }
  .badge-low_confidence { background: #fbe7e7; color: var(--red); }
  .badge-manual_request { background: #ece7f7; color: #5b3fa0; }
  .badge-wellbeing { background: #fbe1e1; color: #9b1c1c; border: 1px solid #f3b4b4; }
  .badge-faq { background: #e2f3e7; color: var(--green-deep); }
  .badge-rag { background: #eef0ec; color: var(--text-muted); }

  select.status-select {
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.78rem;
    font-family: inherit;
    background: #fff;
    color: var(--text-dark);
    cursor: pointer;
  }
  select.status-select:focus { outline: none; border-color: var(--green-mid); box-shadow: 0 0 0 3px rgba(15, 92, 55, 0.12); }

  .empty-state { padding: 38px 18px; text-align: center; color: var(--text-muted); font-size: 0.85rem; }

  /* FAQ / Department list items */
  .list-item { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .list-item:last-child { border-bottom: none; }
  .list-item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .list-item-title { font-weight: 650; font-size: 0.92rem; margin: 0 0 5px; color: var(--green-deep); }
  .list-item-body { color: var(--text-soft); font-size: 0.84rem; margin: 0; line-height: 1.6; }
  .list-item-meta { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag { font-size: 0.72rem; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border); padding: 2px 9px; border-radius: 8px; }
  .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn { background: #fff; border: 1px solid var(--border); color: var(--text-dark); font-size: 0.76rem; padding: 6px 11px; border-radius: 8px; font-family: inherit; cursor: pointer; transition: background 0.18s ease, border-color 0.18s ease; }
  .icon-btn:hover { background: var(--bg); border-color: var(--border-strong); }
  .icon-btn.danger { color: var(--red); border-color: #f0cccc; }
  .icon-btn.danger:hover { background: #fdf2f2; }

  /* Inline form (FAQ/Department create+edit) */
  .form-panel { padding: 18px 20px; border-bottom: 1px solid var(--border); background: rgba(251, 250, 247, 0.7); }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 0.78rem; font-weight: 650; color: var(--text-dark); margin-bottom: 6px; }
  .form-row input, .form-row textarea, .form-row select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    font-size: 0.85rem;
    font-family: inherit;
    background: #fff;
    resize: vertical;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus { outline: none; border-color: var(--green-mid); box-shadow: 0 0 0 3px rgba(15, 92, 55, 0.12); }
  .form-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn-save { background: linear-gradient(135deg, var(--green-deep) 0%, var(--green-bright) 100%); color: #fff; border: none; padding: 9px 18px; border-radius: 10px; font-size: 0.82rem; font-weight: 650; font-family: inherit; cursor: pointer; }
  .btn-save:hover { background: linear-gradient(135deg, var(--green-bright) 0%, var(--green-mid) 100%); }
  .btn-cancel { background: #fff; border: 1px solid var(--border-strong); padding: 9px 18px; border-radius: 10px; font-size: 0.82rem; font-family: inherit; cursor: pointer; color: var(--text-dark); }
  .btn-cancel:hover { background: var(--bg); }
  .form-error { color: var(--red); font-size: 0.78rem; margin-top: 8px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 0.83rem; }
  .checkbox-row input { width: auto; }

  /* Activity log */
  .subtab-row { display: flex; gap: 6px; padding: 14px 20px 0; border-bottom: 1px solid var(--border); }
  .subtab { border: none; background: none; color: var(--text-muted); font-size: 0.83rem; font-family: inherit; padding: 8px 4px; cursor: pointer; border-bottom: 2px solid transparent; margin-right: 16px; }
  .subtab.active { color: var(--green-deep); border-bottom-color: var(--green-deep); font-weight: 650; }

  .log-row { padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 0.83rem; }
  .log-row:last-child { border-bottom: none; }
  .log-row .log-top { display: flex; justify-content: space-between; gap: 12px; }
  .log-actor { font-weight: 650; color: var(--green-deep); }
  .log-time { color: var(--text-muted); font-size: 0.75rem; white-space: nowrap; }
  .log-detail { color: var(--text-soft); margin-top: 4px; line-height: 1.6; }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: linear-gradient(135deg, var(--green-deep) 0%, var(--green-bright) 100%);
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 0.85rem;
    box-shadow: 0 20px 50px -20px rgba(10, 68, 41, 0.8);
    display: none;
    z-index: 50;
  }
  .toast.error { background: linear-gradient(135deg, #a52525 0%, var(--red) 100%); }
  .toast.visible { display: block; }


  @media (max-width: 720px) {
    .sidebar { width: 76px; padding: 18px 8px; }
    .brand-text, .nav-item span.label, .sidebar-footer .staff-name { display: none; }
    .nav-item { justify-content: center; padding: 12px 0; }
    .content { padding: 18px 14px 60px; }
    .topbar { padding: 16px 18px; }
  }
</style>
</head>
<body>

  <!-- ---------- Session restore ---------- -->
  <div class="boot-screen" id="bootScreen">
    <div class="boot-card">
      <div class="boot-crest"><img src="/images/logo.jpeg" alt=""></div>
      <span class="boot-spinner" aria-hidden="true"></span>
      <p>Restoring your session</p>
    </div>
  </div>

  <!-- ---------- Login screen ---------- -->
  <div class="login-screen" id="loginScreen" hidden>
    <div class="login-card">
      <div class="login-crest"><img src="/images/logo.jpeg" alt=""></div>
      <h1>Staff sign in</h1>
      <p class="sub">UNILUS Chipo admin dashboard</p>
      <div class="field">
        <label for="loginUsername">Username</label>
        <input id="loginUsername" type="text" autocomplete="username" />
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" />
      </div>

      <div id="loginFields">
        <button class="btn-primary" id="loginBtn" type="button">Sign in</button>
      </div>

      <div id="signupFields" style="display:none;">
        <div class="field">
          <label for="signupUsername">New username</label>
          <input id="signupUsername" type="text" autocomplete="username" />
        </div>
        <div class="field">
          <label for="signupPassword">Create password</label>
          <input id="signupPassword" type="password" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="signupDepartment">Department</label>
          <select id="signupDepartment" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:0.9rem;font-family:inherit;background:#fff;"></select>
        </div>
        <button class="btn-primary" id="signupBtn" type="button">Create account</button>
      </div>

      <button class="secondary-link" id="toggleSignupBtn" type="button">Create account</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- ---------- Dashboard ---------- -->
  <div class="app" id="app">
    <div class="sidebar">
      <div class="brand">
        <div class="brand-crest"><img src="/images/logo.jpeg" alt=""></div>
        <div class="brand-text">
          <h1>University of Lusaka</h1>
          <p>Chipo — Staff Dashboard</p>
        </div>
      </div>

      <div class="nav-item active" data-tab="tickets">
        <span class="label">Tickets</span>
        <span class="nav-badge" id="openTicketBadge" style="display:none;">0</span>
      </div>
      <div class="nav-item" data-tab="faqs"><span class="label">FAQs</span></div>
      <div class="nav-item" data-tab="departments"><span class="label">Departments</span></div>
      <div class="nav-item" data-tab="staff"><span class="label">Staff accounts</span></div>
      <div class="nav-item" data-tab="logs"><span class="label">Activity Log</span></div>

      <div class="sidebar-footer">
        <div class="staff-name" id="staffName">—</div>
        <button class="logout-link" id="logoutBtn" type="button">Log out</button>
      </div>
    </div>

    <div class="main">
      <div class="topbar">
        <div>
          <h2 id="pageTitle">Tickets</h2>
          <p id="pageSub">Escalated questions waiting on a staff reply</p>
        </div>
      </div>

      <div class="content">

        <!-- ---------- Tickets tab ---------- -->
        <div class="tab-panel" id="tab-tickets">
          <div class="panel">
            <div class="filter-row" id="ticketFilters">
              <button class="filter-chip active" data-status="">Active</button>
              <button class="filter-chip" data-status="open">Open</button>
              <button class="filter-chip" data-status="in_progress">In progress</button>
              <button class="filter-chip" data-status="resolved">Resolved</button>
              <button class="btn-cancel" id="refreshTicketsBtn" type="button">Refresh</button>
            </div>
            <div id="ticketsTableWrap"></div>
          </div>
        </div>

        <!-- ---------- FAQs tab ---------- -->
        <div class="tab-panel" id="tab-faqs" style="display:none;">
          <div class="panel">
            <div class="panel-header">
              <h3>Frequently asked questions</h3>
              <button class="btn-add" id="newFaqBtn" type="button">+ New FAQ</button>
            </div>
            <div id="faqFormWrap"></div>
            <div id="faqListWrap"></div>
          </div>
        </div>

        <!-- ---------- Departments tab ---------- -->
        <div class="tab-panel" id="tab-departments" style="display:none;">
          <div class="panel">
            <div class="panel-header">
              <h3>Departments</h3>
              <button class="btn-add" id="newDeptBtn" type="button">+ New department</button>
            </div>
            <div id="deptFormWrap"></div>
            <div id="deptListWrap"></div>
          </div>
        </div>

        <!-- ---------- Staff accounts tab ---------- -->
        <div class="tab-panel" id="tab-staff" style="display:none;">
          <div class="panel">
            <div class="panel-header">
              <h3>Staff accounts</h3>
              <button class="btn-add" id="newStaffBtn" type="button">+ Create account</button>
            </div>
            <div id="staffFormWrap"></div>
            <div id="staffListWrap"></div>
          </div>
        </div>

        <!-- ---------- Logs tab ---------- -->
        <div class="tab-panel" id="tab-logs" style="display:none;">
          <div class="panel">
            <div class="subtab-row">
              <button class="subtab active" data-logtab="system">Staff activity</button>
              <button class="subtab" data-logtab="chat">Chat activity</button>
            </div>
            <div id="logsWrap"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
<script>
  // ---------- State ----------
  let token = localStorage.getItem('chipo_staff_token') || null;
  let currentTab = 'tickets';
  let currentTicketFilter = '';
  let ticketsLoading = false;
  let ticketRefreshQueued = false;
  let ticketStreamController = null;
  let currentLogTab = 'system';
  let departmentsCache = [];
  let editingFaqId = null;   // null = create mode
  let editingDeptId = null;

  // ---------- Elements ----------
  const bootScreen = document.getElementById('bootScreen');
  const loginScreen = document.getElementById('loginScreen');
  const appEl = document.getElementById('app');
  const loginUsername = document.getElementById('loginUsername');
  const loginPassword = document.getElementById('loginPassword');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const signupFields = document.getElementById('signupFields');
  const signupUsername = document.getElementById('signupUsername');
  const signupPassword = document.getElementById('signupPassword');
  const signupDepartment = document.getElementById('signupDepartment');
  const signupBtn = document.getElementById('signupBtn');
  const toggleSignupBtn = document.getElementById('toggleSignupBtn');
  const staffNameEl = document.getElementById('staffName');
  const logoutBtn = document.getElementById('logoutBtn');
  const pageTitle = document.getElementById('pageTitle');
  const pageSub = document.getElementById('pageSub');
  const toastEl = document.getElementById('toast');

  const TAB_META = {
    tickets: { title: 'Tickets', sub: 'Escalated questions waiting on a staff reply' },
    faqs: { title: 'FAQs', sub: 'Answers Chipo treats as authoritative, on top of the PDF library' },
    departments: { title: 'Departments', sub: 'Who FAQs and tickets belong to' },
    staff: { title: 'Staff accounts', sub: 'Staff access by department' },
    logs: { title: 'Activity Log', sub: 'What staff have changed, and what students have been asking' },
  };

  function showToast(message, isError) {
    toastEl.textContent = message;
    toastEl.className = 'toast visible' + (isError ? ' error' : '');
    setTimeout(() => { toastEl.className = 'toast'; }, 3200);
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' +
      d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  // ---------- API helper ----------
  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      ...(method === 'GET' ? { cache: 'no-store' } : {}),
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { Authorization: 'Bearer ' + token } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });

    if (res.status === 401) {
      logout();
      throw new Error('Your session expired. Please sign in again.');
    }

    if (res.status === 204) return null;

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
  }

  // ---------- Auth ----------
  async function login() {
    const username = loginUsername.value.trim();
    const password = loginPassword.value;
    if (!username || !password) {
      loginError.textContent = 'Enter your username and password.';
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in...';
    loginError.textContent = '';

    try {
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Sign in failed.');

      token = data.token;
      localStorage.setItem('chipo_staff_token', token);
      const profile = await api('GET', '/admin/me');
      applyStaffProfile(profile);
      enterApp();
    } catch (err) {
      loginError.textContent = err.message;
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
    }
  }

  async function loadDepartmentOptionsForSignup() {
    try {
      const data = await fetch('/admin/departments/public').then((res) => res.json());
      const departments = data.departments || [];
      signupDepartment.innerHTML = '<option value="">Choose a department</option>' + departments.map((department) =>
        '<option value="' + department.id + '">' + escapeHtml(department.name) + '</option>'
      ).join('');
      if (!departments.length) {
        signupDepartment.innerHTML = '<option value="">No departments found yet</option>';
      }
    } catch (err) {
      signupDepartment.innerHTML = '<option value="">Departments unavailable</option>';
    }
  }

  function toggleSignupMode(showSignup) {
    signupFields.style.display = showSignup ? 'block' : 'none';
    toggleSignupBtn.textContent = showSignup ? 'Back to sign in' : 'Create account';
    document.getElementById('loginFields').style.display = showSignup ? 'none' : 'block';
    if (!showSignup) {
      signupUsername.value = '';
      signupPassword.value = '';
      signupDepartment.value = '';
    } else {
      loadDepartmentOptionsForSignup();
    }
    loginError.textContent = '';
  }

  async function createStaffAccount() {
    const username = signupUsername.value.trim();
    const password = signupPassword.value;
    const departmentId = signupDepartment.value;
    if (!username || !password || !departmentId) {
      loginError.textContent = 'Enter a username, password, and department to create an account.';
      return;
    }

    signupBtn.disabled = true;
    signupBtn.textContent = 'Creating...';
    loginError.textContent = '';

    try {
      const response = await fetch('/admin/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, departmentId }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Account creation failed.');

      loginUsername.value = username;
      loginPassword.value = password;
      toggleSignupMode(false);
      loginError.textContent = 'Account created. You can sign in now.';
      showToast('Staff account created successfully.', false);
    } catch (err) {
      loginError.textContent = err.message;
    } finally {
      signupBtn.disabled = false;
      signupBtn.textContent = 'Create account';
    }
  }

  function logout() {
    if (ticketStreamController) {
      ticketStreamController.abort();
      ticketStreamController = null;
    }
    token = null;
    localStorage.removeItem('chipo_staff_token');
    window.location.assign('/');
  }

  function showLogin() {
    bootScreen.hidden = true;
    loginScreen.hidden = false;
    appEl.classList.remove('visible');
  }

  async function enterApp() {
    bootScreen.hidden = true;
    loginScreen.hidden = true;
    appEl.classList.add('visible');
    switchTab('tickets');
    connectTicketStream();
  }

  function applyStaffProfile(profile) {
    staffNameEl.textContent = profile.departmentName
      ? `${profile.username} · ${profile.departmentName}`
      : `${profile.username} · Administrator`;
    document.querySelectorAll('.nav-item[data-tab]').forEach((item) => {
      item.style.display = !profile.isAdmin && item.dataset.tab !== 'tickets' ? 'none' : '';
    });
  }

  async function tryResumeSession() {
    if (!token) {
      showLogin();
      return;
    }
    try {
      const me = await api('GET', '/admin/me');
      applyStaffProfile(me);
      enterApp();
    } catch (err) {
      token = null;
      localStorage.removeItem('chipo_staff_token');
      showLogin();
    }
  }

  loginBtn.addEventListener('click', login);
  loginPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
  signupBtn.addEventListener('click', createStaffAccount);
  toggleSignupBtn.addEventListener('click', () => {
    const showSignup = signupFields.style.display === 'none';
    toggleSignupMode(showSignup);
  });
  logoutBtn.addEventListener('click', logout);
  toggleSignupMode(false);

  // ---------- Tab navigation ----------
  document.querySelectorAll('.nav-item[data-tab]').forEach((el) => {
    el.addEventListener('click', () => switchTab(el.dataset.tab));
  });

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-item[data-tab]').forEach((el) => {
      el.classList.toggle('active', el.dataset.tab === tab);
    });
    document.querySelectorAll('.tab-panel').forEach((el) => {
      el.style.display = el.id === 'tab-' + tab ? '' : 'none';
    });
    pageTitle.textContent = TAB_META[tab].title;
    pageSub.textContent = TAB_META[tab].sub;

    if (tab === 'tickets') loadTickets();
    if (tab === 'faqs') loadFaqs();
    if (tab === 'departments') loadDepartments();
    if (tab === 'staff') loadStaff();
    if (tab === 'logs') loadLogs();
  }

  // ================= Tickets =================

  document.querySelectorAll('#ticketFilters .filter-chip').forEach((el) => {
    el.addEventListener('click', () => {
      currentTicketFilter = el.dataset.status;
      document.querySelectorAll('#ticketFilters .filter-chip').forEach((c) => c.classList.remove('active'));
      el.classList.add('active');
      loadTickets();
    });
  });

  document.getElementById('refreshTicketsBtn').addEventListener('click', () => loadTickets());

  async function connectTicketStream() {
    if (!token || ticketStreamController) return;
    const controller = new AbortController();
    ticketStreamController = controller;
    try {
      const response = await fetch('/admin/tickets/stream', {
        headers: { Authorization: 'Bearer ' + token },
        signal: controller.signal,
        cache: 'no-store',
      });
      if (response.status === 401) {
        logout();
        return;
      }
      if (!response.ok || !response.body) {
        throw new Error('Live ticket updates are unavailable.');
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let pending = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        pending += decoder.decode(value, { stream: true });
        const events = pending.split(/\r?\n\r?\n/);
        pending = events.pop() || '';
        for (const event of events) {
          if (event.split(/\r?\n/).some((line) => line === 'data: tickets_changed') &&
              currentTab === 'tickets' && !document.hidden) {
            loadTickets({ silent: true });
          }
        }
      }
    } catch (err) {
      if (err.name !== 'AbortError') console.warn('Live ticket updates disconnected:', err.message);
    } finally {
      if (ticketStreamController === controller) {
        ticketStreamController = null;
        if (token && appEl.classList.contains('visible')) {
          window.setTimeout(connectTicketStream, 3000);
        }
      }
    }
  }

  const STATUS_LABEL = { open: 'Open', in_progress: 'In progress', resolved: 'Resolved' };
      const REASON_LABEL = { low_confidence: 'Low confidence', manual_request: 'Asked for staff', wellbeing: 'Urgent - wellbeing' };

  async function loadTickets({ silent = false } = {}) {
    if (ticketsLoading) {
      ticketRefreshQueued = true;
      return;
    }
    ticketsLoading = true;
    const wrap = document.getElementById('ticketsTableWrap');
    if (!silent) wrap.innerHTML = '<div class="empty-state">Loading tickets…</div>';
    try {
      const qs = currentTicketFilter ? ('?status=' + currentTicketFilter) : '';
      const { tickets } = await api('GET', '/admin/tickets' + qs);

      const openCount = tickets.filter((t) => t.status === 'open').length;
      const badge = document.getElementById('openTicketBadge');
      if (openCount > 0) { badge.style.display = ''; badge.textContent = openCount; }
      else { badge.style.display = 'none'; }

      if (!tickets.length) {
        const emptyMessage = currentTicketFilter
          ? `No ${STATUS_LABEL[currentTicketFilter].toLowerCase()} tickets yet.`
          : 'No active tickets yet.';
        wrap.innerHTML = '<div class="empty-state">' + escapeHtml(emptyMessage) + '</div>';
        return;
      }

      let html = '<div class="table-wrap"><table><thead><tr>' +
        '<th>Reference</th><th>Student contact</th><th>Question</th><th>Department</th><th>Reason</th><th>Confidence</th><th>Status</th><th>Opened</th>' +
        '</tr></thead><tbody>';

      tickets.forEach((t) => {
        html += '<tr>' +
          '<td class="cell-ref">' + escapeHtml(t.id) + '</td>' +
          '<td>' + escapeHtml(t.name || '—') +
            (t.email ? '<br><a href="mailto:' + encodeURIComponent(t.email) + '">' + escapeHtml(t.email) + '</a>' : '<br><span class="cell-muted">No email provided</span>') +
            (t.phone ? '<br><a href="tel:' + encodeURIComponent(t.phone) + '">' + escapeHtml(t.phone) + '</a>' : '<br><span class="cell-muted">No phone provided</span>') +
          '</td>' +
          '<td class="cell-q">' + escapeHtml(t.question) + '</td>' +
          '<td>' + escapeHtml(t.departmentName || 'Unassigned') + '</td>' +
          '<td><span class="badge badge-' + t.reason + '">' + (REASON_LABEL[t.reason] || t.reason) + '</span></td>' +
          '<td class="cell-muted">' + (t.confidence === null ? '—' : t.confidence.toFixed(2)) + '</td>' +
          '<td>' +
            '<select class="status-select" data-id="' + escapeHtml(t.id) + '">' +
              Object.keys(STATUS_LABEL).map((s) =>
                '<option value="' + s + '"' + (s === t.status ? ' selected' : '') + '>' + STATUS_LABEL[s] + '</option>'
              ).join('') +
            '</select>' +
          '</td>' +
          '<td class="cell-muted">' + formatDate(t.createdAt) + '</td>' +
          '</tr>';
      });
      html += '</tbody></table></div>';
      wrap.innerHTML = html;

      wrap.querySelectorAll('.status-select').forEach((sel) => {
        sel.addEventListener('change', async () => {
          const id = sel.dataset.id;
          const newStatus = sel.value;
          try {
            await api('PATCH', '/admin/tickets/' + id + '/status', { status: newStatus });
            showToast('Ticket ' + id + ' marked ' + STATUS_LABEL[newStatus].toLowerCase() + '.');
            loadTickets();
          } catch (err) {
            showToast(err.message, true);
          }
        });
      });
    } catch (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message) + '</div>';
    } finally {
      ticketsLoading = false;
      if (ticketRefreshQueued) {
        ticketRefreshQueued = false;
        loadTickets({ silent: true });
      }
    }
  }

  window.setInterval(() => {
    if (token && appEl.classList.contains('visible') && currentTab === 'tickets' && !document.hidden) {
      loadTickets({ silent: true });
    }
  }, 5000);

  // ================= FAQs =================

  document.getElementById('newFaqBtn').addEventListener('click', () => {
    editingFaqId = null;
    renderFaqForm();
  });

  function renderFaqForm(existing) {
    const wrap = document.getElementById('faqFormWrap');
    const deptOptions = '<option value="">No department</option>' +
      departmentsCache.map((d) =>
        '<option value="' + d.id + '"' + (existing && existing.departmentId === d.id ? ' selected' : '') + '>' + escapeHtml(d.name) + '</option>'
      ).join('');

    wrap.innerHTML =
      '<div class="form-panel">' +
        '<div class="form-row"><label>Question</label><input id="faqQuestion" type="text" value="' + escapeHtml(existing ? existing.question : '') + '" /></div>' +
        '<div class="form-row"><label>Answer</label><textarea id="faqAnswer" rows="3">' + escapeHtml(existing ? existing.answer : '') + '</textarea></div>' +
        '<div class="form-row"><label>Department</label><select id="faqDept">' + deptOptions + '</select></div>' +
        '<div class="checkbox-row"><input type="checkbox" id="faqActive" ' + (!existing || existing.isActive ? 'checked' : '') + ' /> <label for="faqActive" style="margin:0;">Active (Chipo can use this)</label></div>' +
        '<div class="form-actions">' +
          '<button class="btn-save" id="faqSaveBtn" type="button">' + (existing ? 'Save changes' : 'Create FAQ') + '</button>' +
          '<button class="btn-cancel" id="faqCancelBtn" type="button">Cancel</button>' +
        '</div>' +
        '<div class="form-error" id="faqFormError"></div>' +
      '</div>';

    document.getElementById('faqCancelBtn').addEventListener('click', () => { wrap.innerHTML = ''; });
    document.getElementById('faqSaveBtn').addEventListener('click', () => saveFaq(existing ? existing.id : null));
  }

  async function saveFaq(id) {
    const question = document.getElementById('faqQuestion').value.trim();
    const answer = document.getElementById('faqAnswer').value.trim();
    const departmentId = document.getElementById('faqDept').value || null;
    const isActive = document.getElementById('faqActive').checked;
    const errorEl = document.getElementById('faqFormError');
    const btn = document.getElementById('faqSaveBtn');

    if (!question || !answer) {
      errorEl.textContent = 'Question and answer are both required.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving…';
    errorEl.textContent = '';

    try {
      if (id) {
        await api('PUT', '/admin/faqs/' + id, { question, answer, departmentId, isActive });
        showToast('FAQ updated.');
      } else {
        await api('POST', '/admin/faqs', { question, answer, departmentId, isActive });
        showToast('FAQ created.');
      }
      document.getElementById('faqFormWrap').innerHTML = '';
      loadFaqs();
    } catch (err) {
      errorEl.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = id ? 'Save changes' : 'Create FAQ';
    }
  }

  async function loadFaqs() {
    if (!departmentsCache.length) {
      try { departmentsCache = (await api('GET', '/admin/departments')).departments; } catch (e) { /* ignore, dropdown just stays empty */ }
    }
    const wrap = document.getElementById('faqListWrap');
    wrap.innerHTML = '<div class="empty-state">Loading FAQs…</div>';
    try {
      const { faqs } = await api('GET', '/admin/faqs');
      if (!faqs.length) {
        wrap.innerHTML = '<div class="empty-state">No FAQs yet. Add one so Chipo can answer it directly.</div>';
        return;
      }
      const deptName = (id) => (departmentsCache.find((d) => d.id === id) || {}).name;

      wrap.innerHTML = faqs.map((f) =>
        '<div class="list-item">' +
          '<div class="list-item-top">' +
            '<div>' +
              '<p class="list-item-title">' + escapeHtml(f.question) + '</p>' +
              '<p class="list-item-body">' + escapeHtml(f.answer) + '</p>' +
              '<div class="list-item-meta">' +
                (f.departmentId ? '<span class="tag">' + escapeHtml(deptName(f.departmentId) || 'Unknown dept.') + '</span>' : '') +
                '<span class="tag">' + (f.isActive ? 'Active' : 'Inactive') + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="item-actions">' +
              '<button class="icon-btn" data-edit="' + f.id + '">Edit</button>' +
              '<button class="icon-btn danger" data-delete="' + f.id + '">Delete</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      ).join('');

      wrap.querySelectorAll('[data-edit]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const faq = faqs.find((f) => f.id === btn.dataset.edit);
          editingFaqId = faq.id;
          renderFaqForm(faq);
          const formWrap = document.getElementById('faqFormWrap');
          if (typeof formWrap.scrollIntoView === 'function') {
            formWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        });
      });
      wrap.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this FAQ? Chipo will stop using it right away.')) return;
          try {
            await api('DELETE', '/admin/faqs/' + btn.dataset.delete);
            showToast('FAQ deleted.');
            loadFaqs();
          } catch (err) {
            showToast(err.message, true);
          }
        });
      });
    } catch (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message) + '</div>';
    }
  }

  // ================= Departments =================

  document.getElementById('newDeptBtn').addEventListener('click', () => {
    editingDeptId = null;
    renderDeptForm();
  });

  function renderDeptForm(existing) {
    const wrap = document.getElementById('deptFormWrap');
    wrap.innerHTML =
      '<div class="form-panel">' +
        '<div class="form-row"><label>Name</label><input id="deptName" type="text" value="' + escapeHtml(existing ? existing.name : '') + '" /></div>' +
        '<div class="form-row"><label>Contact email</label><input id="deptEmail" type="email" value="' + escapeHtml(existing ? (existing.contactEmail || '') : '') + '" /></div>' +
        '<div class="form-row"><label>Ticket routing keywords</label><input id="deptKeywords" type="text" value="' + escapeHtml(existing ? (existing.routingKeywords || []).join(', ') : '') + '" placeholder="e.g. registration, transcripts, exam results" /><small class="cell-muted">Separate terms or phrases with commas. FAQ-owned tickets still go to their FAQ department.</small></div>' +
        '<div class="form-actions">' +
          '<button class="btn-save" id="deptSaveBtn" type="button">' + (existing ? 'Save changes' : 'Create department') + '</button>' +
          '<button class="btn-cancel" id="deptCancelBtn" type="button">Cancel</button>' +
        '</div>' +
        '<div class="form-error" id="deptFormError"></div>' +
      '</div>';

    document.getElementById('deptCancelBtn').addEventListener('click', () => { wrap.innerHTML = ''; });
    document.getElementById('deptSaveBtn').addEventListener('click', () => saveDept(existing ? existing.id : null));
  }

  async function saveDept(id) {
    const name = document.getElementById('deptName').value.trim();
    const contactEmail = document.getElementById('deptEmail').value.trim();
    const routingKeywords = document.getElementById('deptKeywords').value.split(',').map((keyword) => keyword.trim()).filter(Boolean);
    const errorEl = document.getElementById('deptFormError');
    const btn = document.getElementById('deptSaveBtn');

    if (!name) {
      errorEl.textContent = 'Department name is required.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving…';
    errorEl.textContent = '';

    try {
      if (id) {
        await api('PUT', '/admin/departments/' + id, { name, contactEmail, routingKeywords });
        showToast('Department updated.');
      } else {
        await api('POST', '/admin/departments', { name, contactEmail, routingKeywords });
        showToast('Department created.');
      }
      document.getElementById('deptFormWrap').innerHTML = '';
      departmentsCache = []; // force refresh so the FAQ form's dropdown stays current
      loadDepartments();
    } catch (err) {
      errorEl.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = id ? 'Save changes' : 'Create department';
    }
  }

  async function loadDepartments() {
    const wrap = document.getElementById('deptListWrap');
    wrap.innerHTML = '<div class="empty-state">Loading departments…</div>';
    try {
      const { departments } = await api('GET', '/admin/departments');
      departmentsCache = departments;

      if (!departments.length) {
        wrap.innerHTML = '<div class="empty-state">No departments yet.</div>';
        return;
      }

      wrap.innerHTML = departments.map((d) =>
        '<div class="list-item">' +
          '<div class="list-item-top">' +
            '<div>' +
              '<p class="list-item-title">' + escapeHtml(d.name) + '</p>' +
              '<p class="list-item-body">' + escapeHtml(d.contactEmail || 'No contact email on file') + '</p>' +
              (d.routingKeywords && d.routingKeywords.length ? '<div class="list-item-meta">' + d.routingKeywords.map((keyword) => '<span class="tag">' + escapeHtml(keyword) + '</span>').join('') + '</div>' : '') +
            '</div>' +
            '<div class="item-actions">' +
              '<button class="icon-btn" data-edit="' + d.id + '">Edit</button>' +
              '<button class="icon-btn danger" data-delete="' + d.id + '">Delete</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      ).join('');

      wrap.querySelectorAll('[data-edit]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const dept = departments.find((d) => d.id === btn.dataset.edit);
          editingDeptId = dept.id;
          renderDeptForm(dept);
        });
      });
      wrap.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this department? FAQs linked to it will keep their answer but lose the department tag.')) return;
          try {
            await api('DELETE', '/admin/departments/' + btn.dataset.delete);
            showToast('Department deleted.');
            departmentsCache = [];
            loadDepartments();
          } catch (err) {
            showToast(err.message, true);
          }
        });
      });
    } catch (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message) + '</div>';
    }
  }

  // ================= Staff accounts =================

  document.getElementById('newStaffBtn').addEventListener('click', async () => {
    if (!departmentsCache.length) {
      try { departmentsCache = (await api('GET', '/admin/departments')).departments; } catch (err) { showToast(err.message, true); return; }
    }
    renderStaffForm();
  });

  function renderStaffForm() {
    const wrap = document.getElementById('staffFormWrap');
    const deptOptions = '<option value="">Choose a department</option>' + departmentsCache.map((department) =>
      '<option value="' + department.id + '">' + escapeHtml(department.name) + '</option>'
    ).join('');
    wrap.innerHTML = '<div class="form-panel">' +
      '<div class="form-row"><label for="staffUsername">Username</label><input id="staffUsername" type="text" autocomplete="off" /></div>' +
      '<div class="form-row"><label for="staffPassword">Temporary password</label><input id="staffPassword" type="password" autocomplete="new-password" minlength="8" /></div>' +
      '<div class="form-row"><label for="staffDepartment">Department</label><select id="staffDepartment">' + deptOptions + '</select></div>' +
      '<div class="form-actions"><button class="btn-save" id="staffSaveBtn" type="button">Create account</button><button class="btn-cancel" id="staffCancelBtn" type="button">Cancel</button></div>' +
      '<div class="form-error" id="staffFormError"></div></div>';
    document.getElementById('staffCancelBtn').addEventListener('click', () => { wrap.innerHTML = ''; });
    document.getElementById('staffSaveBtn').addEventListener('click', saveStaff);
  }

  async function saveStaff() {
    const username = document.getElementById('staffUsername').value.trim();
    const password = document.getElementById('staffPassword').value;
    const departmentId = document.getElementById('staffDepartment').value;
    const errorEl = document.getElementById('staffFormError');
    const btn = document.getElementById('staffSaveBtn');
    if (!username || !password || !departmentId) {
      errorEl.textContent = 'Username, password, and department are required.';
      return;
    }
    btn.disabled = true;
    errorEl.textContent = '';
    try {
      await api('POST', '/admin/staff', { username, password, departmentId });
      document.getElementById('staffFormWrap').innerHTML = '';
      showToast('Staff account created. Share the password securely with the staff member.');
      loadStaff();
    } catch (err) {
      errorEl.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  }

  async function loadStaff() {
    const wrap = document.getElementById('staffListWrap');
    wrap.innerHTML = '<div class="empty-state">Loading staff accounts…</div>';
    try {
      const { staff } = await api('GET', '/admin/staff');
      if (!staff.length) {
        wrap.innerHTML = '<div class="empty-state">No staff accounts yet.</div>';
        return;
      }
      wrap.innerHTML = staff.map((member) => '<div class="list-item"><div class="list-item-top"><div>' +
        '<p class="list-item-title">' + escapeHtml(member.username) + '</p>' +
        '<p class="list-item-body">' + escapeHtml(member.departmentName || (member.isAdmin ? 'Administrator' : 'No department')) + '</p>' +
        '</div><span class="cell-muted">' + (member.isAdmin ? 'Administrator' : 'Department staff') + '</span></div></div>').join('');
    } catch (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message) + '</div>';
    }
  }

  // ================= Activity Log =================

  document.querySelectorAll('.subtab[data-logtab]').forEach((el) => {
    el.addEventListener('click', () => {
      currentLogTab = el.dataset.logtab;
      document.querySelectorAll('.subtab[data-logtab]').forEach((s) => s.classList.remove('active'));
      el.classList.add('active');
      loadLogs();
    });
  });

  async function loadLogs() {
    const wrap = document.getElementById('logsWrap');
    wrap.innerHTML = '<div class="empty-state">Loading…</div>';

    try {
      if (currentLogTab === 'system') {
        const { events } = await api('GET', '/admin/logs/system?limit=100');
        if (!events.length) {
          wrap.innerHTML = '<div class="empty-state">No staff activity recorded yet.</div>';
          return;
        }
        wrap.innerHTML = events.map((e) =>
          '<div class="log-row">' +
            '<div class="log-top"><span class="log-actor">' + escapeHtml(e.actor) + '</span><span class="log-time">' + formatDate(e.createdAt) + '</span></div>' +
            '<div>' + escapeHtml(e.action) + '</div>' +
            (e.detail ? '<div class="log-detail">' + escapeHtml(e.detail) + '</div>' : '') +
          '</div>'
        ).join('');
      } else {
        const { messages } = await api('GET', '/admin/logs/chat?limit=100');
        if (!messages.length) {
          wrap.innerHTML = '<div class="empty-state">No chat activity recorded yet.</div>';
          return;
        }
        wrap.innerHTML = messages.map((m) =>
          '<div class="log-row">' +
            '<div class="log-top">' +
              '<span class="log-actor">' + escapeHtml(m.question) + '</span>' +
              '<span class="log-time">' + formatDate(m.createdAt) + '</span>' +
            '</div>' +
            '<div class="log-detail">' + escapeHtml(m.answer) + '</div>' +
            '<div class="list-item-meta" style="margin-top:6px;">' +
              '<span class="badge badge-' + (m.source === 'faq' ? 'faq' : 'rag') + '">' + (m.source === 'faq' ? 'FAQ match' : 'Document search') + '</span>' +
              '<span class="tag">confidence ' + (m.confidence === null ? '—' : m.confidence.toFixed(2)) + '</span>' +
              (m.needsHuman ? '<span class="badge badge-low_confidence">Flagged for staff</span>' : '') +
            '</div>' +
          '</div>'
        ).join('');
      }
    } catch (err) {
      wrap.innerHTML = '<div class="empty-state">' + escapeHtml(err.message) + '</div>';
    }
  }

  // ---------- Boot ----------
  tryResumeSession();
</script>
</body>
</html>
